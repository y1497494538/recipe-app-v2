name: sync-gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 串行化：连续 push 时排队执行，避免多次 force-push 互相覆盖（之前丢过一次部署）
concurrency:
  group: sync-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble dist
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          touch dist/.nojekyll
          if [ -d data ]; then cp -r data dist/data; fi
          ls -la dist

      - name: Push to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name 'sync-bot'
          git config user.email 'sync-bot@users.noreply.github.com'
          git add -A
          git commit -q -m 'deploy from main'
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
