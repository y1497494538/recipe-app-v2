<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='theme-color' content='#f7f5f2'>
<title>今天想吃什么</title>
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#1f1d1a;--sub:#8a827a;--line:#e8e3dc;--acc:#e0603a;--acc2:#f3d9cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;padding-bottom:130px}
header{position:sticky;top:0;z-index:20;background:rgba(247,245,242,.95);backdrop-filter:blur(10px);padding:12px 14px 6px;border-bottom:1px solid var(--line)}
h1{margin:0 0 9px;font-size:19px;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px}
h1 small{font-weight:400;font-size:12px;color:var(--sub)}
.search{position:relative}
.search input{width:100%;padding:11px 40px 11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--acc)}
.clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:#eee9e3;color:#6b6259;width:24px;height:24px;border-radius:50%;line-height:1;font-size:15px;cursor:pointer;display:none;padding:0}
.cats{display:flex;gap:7px;overflow-x:auto;padding:9px 0 3px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:13px;cursor:pointer;white-space:nowrap}
.cats button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.count{font-size:12px;color:var(--sub);padding:8px 14px 8px}
.grid{display:grid;grid-template-columns:1fr;gap:12px;padding:0 14px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{position:relative;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:transform .12s,border-color .15s}
.card:active{transform:scale(.985)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.bn{position:relative;height:100px;display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,#fdeee7,#f6e6dc)}
.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bn .emo{position:relative}
.bn.hasimg .emo{display:none}
.bd{padding:10px 12px 12px}
.nm{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
.meta{font-size:12px;color:var(--sub);margin:4px 0 6px;display:flex;gap:9px;flex-wrap:wrap}
.igs{font-size:12px;color:#6b6259;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info{position:absolute;right:8px;top:8px;z-index:2;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#5a5249;font-size:13px;cursor:pointer;line-height:1;padding:0}
.ck{position:absolute;left:8px;top:8px;z-index:2;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.card.sel .ck{background:var(--acc);color:#fff}
.more{display:block;width:calc(100% - 28px);margin:14px auto 0;padding:12px;border-radius:12px;border:1px dashed #d9d1c7;background:transparent;color:var(--sub);font-size:14px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));transform:translateY(120%);transition:transform .22s;box-shadow:0 -6px 24px rgba(0,0,0,.07)}
.bar.up{transform:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-height:70px;overflow:auto;margin-bottom:8px}
.chip{background:#f1ece6;border-radius:999px;padding:3px 10px;font-size:12px;color:#6b6259;display:flex;align-items:center;gap:5px;cursor:pointer;border:0}
.chip b{font-weight:600;color:var(--acc)}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;background:#fff}
.btn{padding:10px 16px;border-radius:10px;border:0;font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn.p{background:var(--acc);color:#fff;font-weight:600}
.btn.s{background:#f1ece6;color:#6b6259}
.btn:disabled{opacity:.55}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(28,24,20,.45);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .18s}
.sheet.on{opacity:1;pointer-events:auto}
.panel{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .2s;max-width:760px;margin:0 auto}
.sheet.on .panel{transform:none}
.panel h2{margin:4px 0 8px;font-size:20px}
.panel h3{margin:18px 0 8px;font-size:13px;color:var(--acc);letter-spacing:1px;font-weight:700}
.panel ul{margin:0;padding-left:18px}
.panel li{margin-bottom:5px;font-size:14px;line-height:1.65}
.panel ol{padding-left:20px;margin:0}
.panel ol li{margin-bottom:10px}
.tip{margin-top:14px;padding:11px 13px;background:#fff8ef;border:1px solid #f5e4cc;border-radius:10px;font-size:13px;color:#8a6a3c;line-height:1.65}
.toast{position:fixed;left:50%;bottom:160px;transform:translate(-50%,10px);background:rgba(35,30,26,.93);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:82vw;text-align:center;line-height:1.4}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{padding:56px 24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.9}
</style>
</head>
<body>
<header>
  <h1>今天想吃什么 <small id='hint'>点菜 → 推送</small></h1>
  <div class='search'>
    <input id='q' type='search' placeholder='搜菜名或食材，如「土豆」「牛肉」' autocomplete='off'>
    <button class='clr' id='clr' type='button'>&times;</button>
  </div>
  <div class='cats' id='cats'></div>
</header>
<div class='count' id='count'></div>
<div class='grid' id='grid'></div>
<div class='empty' id='empty' style='display:none'></div>
<div id='more'></div>
<div class='bar' id='bar'>
  <div class='chips' id='chips'></div>
  <div class='row'>
    <input id='note' placeholder='想说的话（可选）' maxlength='60'>
    <button class='btn s' id='copy' type='button'>复制</button>
    <button class='btn p' id='send' type='button'>发送</button>
  </div>
</div>
<div class='sheet' id='sheet'><div class='panel' id='panel'></div></div>
<div class='toast' id='toast'></div>
<script src='data/d01.js'></script>
<script>
var ALL = window.RECIPES || [];
var sel = {};
var ST = { q: '', cat: '全部', limit: 36 };
var KS = 'recipe_sckey';

function $(i){ return document.getElementById(i); }
function baseName(s){ return String(s||'').split(/[\s0-9（(、·]/)[0]; }
function getKey(){ try{ return localStorage.getItem(KS)||''; }catch(e){ return ''; } }

(function bindKey(){
  var h = location.hash || '';
  if(h.indexOf('#SCT') === 0){
    var k = h.slice(1);
    try{ localStorage.setItem(KS, k); }catch(e){}
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  }
})();

var CATS = ['全部'];
ALL.forEach(function(r){ if(r.cat && CATS.indexOf(r.cat) < 0) CATS.push(r.cat); });

function kws(){
  return ST.q.trim().toLowerCase().split(/\s+/).filter(function(w){ return w; });
}
function hit(r){
  var k = kws();
  if(!k.length) return true;
  var hay = ((r.name||'') + ' ' + (r.cat||'') + ' ' + (r.ing||[]).join(' ')).toLowerCase();
  return k.every(function(w){ return hay.indexOf(w) >= 0; });
}
function list(){
  return ALL.filter(hit).filter(function(r){ return ST.cat === '全部' || r.cat === ST.cat; });
}
function selCount(){ return Object.keys(sel).length; }
function selList(){ return ALL.filter(function(r){ return sel[r.id]; }); }
function selNames(){ return selList().map(function(r){ return r.name; }); }

function toast(m){
  var t = $('toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove('on'); }, 2400);
}

function renderCats(){
  $('cats').innerHTML = CATS.map(function(c){
    return '<button type=\'button\' data-cat=\'' + c + '\'' + (c === ST.cat ? ' class=\'on\'' : '') + '>' + c + '</button>';
  }).join('');
}

function cardHTML(r){
  var c = sel[r.id] ? ' sel' : '';
  var img = r.img ? '<img src=\'' + r.img + '\' alt=\'\' loading=\'lazy\'>' : '';
  var ings = (r.ing||[]).map(baseName).filter(function(x){ return x; }).slice(0, 6).join(' · ');
  return '<div class=\'card' + c + '\' data-id=\'' + r.id + '\'>'
    + '<div class=\'bn' + (r.img ? ' hasimg' : '') + '\'>' + img + '<span class=\'emo\'>' + (r.emoji||'🍽') + '</span></div>'
    + '<button class=\'info\' type=\'button\' data-info=\'' + r.id + '\'>i</button>'
    + '<div class=\'ck\'>&#10003;</div>'
    + '<div class=\'bd\'>'
    +   '<div class=\'nm\'>' + r.name + '</div>'
    +   '<div class=\'meta\'><span>⏱ ' + (r.time||'-') + ' 分钟</span><span>' + (r.diff||'') + '</span><span>' + (r.cat||'') + '</span></div>'
    +   '<div class=\'igs\'>' + ings + '</div>'
    + '</div></div>';
}

function render(){
  var L = list();
  var shown = L.slice(0, ST.limit);
  $('count').textContent = L.length
    ? ('找到 ' + L.length + ' 道' + (ST.q.trim() ? ' · 「' + ST.q.trim() + '」' : ''))
    : '';
  $('grid').innerHTML = shown.map(cardHTML).join('');
  var em = $('empty');
  if(!L.length){
    em.style.display = 'block';
    em.innerHTML = ALL.length
      ? '没找到这道菜<br><span style=\'font-size:13px\'>换个食材试试：鸡蛋、土豆、豆腐、牛肉、白菜</span>'
      : '菜单正在加载…';
  } else { em.style.display = 'none'; }
  var rest = L.length - shown.length;
  $('more').innerHTML = rest > 0
    ? '<button class=\'more\' type=\'button\' id=\'moreBtn\'>还有 ' + rest + ' 道，继续加载</button>'
    : '';
  if(rest > 0){ $('moreBtn').onclick = function(){ ST.limit += 36; render(); }; }
  var imgs = $('grid').querySelectorAll('.bn img');
  for(var i = 0; i < imgs.length; i++){
    imgs[i].addEventListener('error', function(){ this.parentNode.classList.remove('hasimg'); this.remove(); });
  }
}

function renderBar(){
  var n = selCount();
  $('bar').classList.toggle('up', n > 0);
  $('chips').innerHTML = selList().map(function(r){
    return '<button class=\'chip\' type=\'button\' data-rm=\'' + r.id + '\'><b>' + (r.emoji||'') + '</b>' + r.name + ' ×</button>';
  }).join('') + (n > 1 ? '<button class=\'chip\' type=\'button\' id=\'clrSel\'>清空</button>' : '');
  if(n > 1){ $('clrSel').onclick = function(){ sel = {}; renderBar(); render(); }; }
}

function toggle(id){
  if(sel[id]) delete sel[id]; else sel[id] = 1;
  renderBar();
  var card = document.querySelector('.card[data-id=\'' + id + '\']');
  if(card) card.classList.toggle('sel', !!sel[id]);
}

function openDish(id){
  var r = ALL.filter(function(x){ return x.id === id; })[0];
  if(!r) return;
  var inSel = !!sel[id];
  $('panel').innerHTML =
      '<h2>' + (r.emoji||'🍽') + ' ' + r.name + '</h2>'
    + '<div class=\'meta\'><span>⏱ ' + (r.time||'-') + ' 分钟</span><span>' + (r.diff||'') + '</span><span>' + (r.cat||'') + '</span></div>'
    + '<h3>用料 · ' + (r.ing||[]).length + ' 样</h3>'
    + '<ul>' + (r.ing||[]).map(function(s){ return '<li>' + s + '</li>'; }).join('') + '</ul>'
    + '<h3>做法</h3>'
    + '<ol>' + (r.steps||[]).map(function(s){ return '<li>' + s + '</li>'; }).join('') + '</ol>'
    + (r.tip ? '<div class=\'tip\'>💡 ' + r.tip + '</div>' : '')
    + '<div style=\'display:flex;gap:8px;margin-top:18px\'>'
    +   '<button class=\'btn ' + (inSel ? 's' : 'p') + '\' type=\'button\' id=\'tog\' style=\'flex:1\'>' + (inSel ? '移出这一顿' : '加入这一顿') + '</button>'
    +   '<button class=\'btn s\' type=\'button\' id=\'cls\'>关闭</button>'
    + '</div>';
  $('sheet').classList.add('on');
  $('tog').onclick = function(){ toggle(id); $('sheet').classList.remove('on'); };
  $('cls').onclick = function(){ $('sheet').classList.remove('on'); };
}

function buildText(){
  var L = selList();
  var shop = {};
  L.forEach(function(r){
    (r.ing||[]).forEach(function(s){
      var n = baseName(s);
      if(!n) return;
      if(!shop[n]) shop[n] = [];
      if(shop[n].indexOf(r.name) < 0) shop[n].push(r.name);
    });
  });
  var keys = Object.keys(shop).sort();
  var t = '【今晚点菜】' + L.map(function(r){ return r.name; }).join('、') + '\n';
  t += '共 ' + L.length + ' 道\n\n';
  t += '====== 采购清单（' + keys.length + ' 样）======\n';
  t += keys.map(function(n){ return '· ' + n + '（' + shop[n].join('、') + '）'; }).join('\n') + '\n';
  L.forEach(function(r, i){
    t += '\n====== ' + (i+1) + '. ' + r.name + ' · ' + (r.time||'-') + '分钟 · ' + (r.diff||'') + ' ======\n';
    t += '【用料】\n' + (r.ing||[]).map(function(s){ return '  - ' + s; }).join('\n') + '\n';
    t += '【做法】\n' + (r.steps||[]).map(function(s, k){ return '  ' + (k+1) + ') ' + s; }).join('\n') + '\n';
    if(r.tip) t += '【关键点】' + r.tip + '\n';
  });
  var note = $('note').value.trim();
  if(note) t += '\n【留言】' + note;
  return t;
}

function copyText(t){
  function fb(){
    var a = document.createElement('textarea');
    a.value = t;
    a.style.position = 'fixed';
    a.style.opacity = '0';
    document.body.appendChild(a);
    a.select();
    try{ document.execCommand('copy'); toast('已复制到剪贴板'); }
    catch(e){ toast('复制失败，请长按选择'); }
    a.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast('已复制到剪贴板'); }, fb);
  } else fb();
}

function sendNow(){
  var n = selCount();
  if(!n){ toast('还没选菜呢'); return; }
  var txt = buildText();
  var k = getKey();
  if(!k){
    copyText(txt);
    toast('还没绑定推送，已复制文字，粘给 TA 就行');
    return;
  }
  var body = new URLSearchParams();
  body.append('title', '🍳 点菜：' + selNames().join('、'));
  body.append('desp', txt);
  var btn = $('send');
  btn.disabled = true;
  btn.textContent = '发送中';
  fetch('https://sctapi.ftqq.com/' + k + '.send', { method: 'POST', mode: 'no-cors', body: body })
    .then(function(){ toast('已发出，检查下微信'); })
    .catch(function(){ copyText(txt); toast('网络不通，已复制文字'); })
    .then(function(){ btn.disabled = false; btn.textContent = '发送'; });
}

$('q').addEventListener('input', function(){
  ST.q = this.value;
  ST.limit = 36;
  $('clr').style.display = this.value ? 'block' : 'none';
  render();
});
$('clr').addEventListener('click', function(){
  $('q').value = '';
  ST.q = '';
  ST.limit = 36;
  this.style.display = 'none';
  render();
});
$('cats').addEventListener('click', function(e){
  var b = e.target.closest('[data-cat]');
  if(!b) return;
  ST.cat = b.getAttribute('data-cat');
  ST.limit = 36;
  renderCats();
  render();
});
$('grid').addEventListener('click', function(e){
  var info = e.target.closest('[data-info]');
  if(info){ openDish(info.getAttribute('data-info')); return; }
  var card = e.target.closest('.card');
  if(card){ toggle(card.getAttribute('data-id')); }
});
$('chips').addEventListener('click', function(e){
  var b = e.target.closest('[data-rm]');
  if(b){ toggle(b.getAttribute('data-rm')); if(selCount() === 0) renderBar(); }
});
$('sheet').addEventListener('click', function(e){ if(e.target === $('sheet')) $('sheet').classList.remove('on'); });
$('send').addEventListener('click', sendNow);
$('copy').addEventListener('click', function(){
  if(!selCount()){ toast('还没选菜呢'); return; }
  copyText(buildText());
});

if(getKey()) $('hint').textContent = '已绑定推送';
renderCats();
render();
renderBar();
</script>
</body>
</html>
